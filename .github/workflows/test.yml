name: 测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 语法检查
        run: |
          for f in js/*.js lib/*.mjs server.mjs worker.js scripts/*.mjs; do
            node --check "$f"
          done

      - name: 检查 Worker 配置（不部署）
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      # 先构建 dist/，再同时测试 Node 版 server.mjs 与本地 Worker（wrangler dev）
      - name: 端到端测试
        run: npm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
