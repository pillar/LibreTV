name: 测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 语法检查
        run: |
          for f in js/*.js lib/*.mjs server.mjs functions/_middleware.js "functions/proxy/[[path]].js"; do
            node --check "$f"
          done

      - name: 检查 css/tailwind.css 是否为最新编译结果
        run: |
          npm run build:css
          git diff --exit-code css/tailwind.css || (echo "::error::css/tailwind.css 已过期，请运行 npm run build:css 并提交" && exit 1)

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      - name: 端到端测试
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
