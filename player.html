<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="referrer" content="same-origin">
    <title>PlayAny TV 播放器</title>

    <!-- Favicon -->
    <link rel="icon" href="image/logo.png">
    <link rel="apple-touch-icon" href="image/icon-512.png">
    <link rel="manifest" href="manifest.json">
    <!-- 登录状态由服务端写入（替换下方占位符）；App 内没有服务端，保持 null 表示无需密码 -->
    <script type="application/json" id="auth-state">/*AUTH*/null</script>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/theme.css">
    <!-- 预编译的 Tailwind 样式（npm run build:css），放在最后以保持与原运行时注入相同的覆盖顺序 -->
    <link rel="stylesheet" href="css/tailwind.css">
    
    <!-- Add optimized player loading styles -->
    <style>
      /* Critical header and navigation styles */
      .player-header {
        position: relative;
        z-index: 2147483647 !important;
        pointer-events: auto !important;
      }
      
      /* Critical loading styles to prevent FOUC */
      .player-placeholder {
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 16/9 !important;
        background-color: #1f2937 !important;
        position: relative !important;
        display: block !important;
        border-radius: 8px !important;
        overflow: hidden !important;
      }
      
      .player-loading-container {
        width: 100% !important;
        height: 0 !important;
        padding-bottom: 56.25% !important;
        position: relative !important;
        background-color: #1f2937 !important;
        border-radius: 8px !important;
        overflow: hidden !important;
        display: block !important;
      }
      
      .player-loading-overlay {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        background-color: rgba(17, 24, 39, 0.7) !important;
      }
      
      .player-loading-spinner {
        width: 48px !important;
        height: 48px !important;
        border-radius: 50% !important;
        position: relative !important;
        margin-bottom: 16px !important;
      }
    
      /* Critical styles for loading text */
      .player-loading-text,
      .player-loading-overlay div:nth-child(2),
      div.player-loading-text {
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        color: #f9fafb !important;
        font-size: 16px !important;
        font-weight: 500 !important;
        margin-bottom: 8px !important;
        text-align: center !important;
        font-family: system-ui, -apple-system, sans-serif !important;
        line-height: 1.4 !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1) !important;
        pointer-events: none !important;
        z-index: 100 !important;
        background: transparent !important;
        max-width: 90% !important;
      }
      
      @keyframes player-spinner-rotate {
        to { transform: rotate(360deg); }
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* ArtPlayer specific styles */
      .art-video-player, .art-video-player video {
        width: 100% !important;
        height: 100% !important;
        min-height: 150px !important;
        max-height: 100vh !important;
        background: #000 !important;
        object-fit: contain !important;
        /* position: relative !important; */
        display: block !important;
      }
    
      /* Fix for Chrome-specific issues */
      @media screen and (-webkit-min-device-pixel-ratio: 0) {
        .art-video-player video {
          transform: translateZ(0) !important;
          will-change: transform !important;
        }
    
        /* Force visibility of video element */
        .art-video-player.art-playing video {
          visibility: visible !important;
          opacity: 1 !important;
        }
      }

      .player-header-fixed {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100vw;
        z-index: 9000 !important;
        pointer-events: auto !important;
        background: #111;
      }
      #homeButton { pointer-events: auto !important; }
      body { padding-top: 72px; }
    </style>
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="player-page">
    <header class="player-header-fixed p-4 flex items-center border-b border-separator gap-2">
        <div class="flex items-center min-w-0">
            <button id="homeButton" type="button" class="flex items-center min-w-0 cursor-pointer" style="background:none;border:none;padding:0;">
                <img src="image/logo.png" alt="" class="w-8 h-8 mr-2 rounded-lg logo-icon">
                <h1 class="text-xl font-semibold logo-text">PlayAny TV</h1>
            </button>
        </div>
        <h2 id="videoTitle" class="text-xl font-semibold flex-1 text-center overflow-x-auto whitespace-nowrap truncate custom-title-scroll"></h2>
        <a href="#" id="goBack" data-action="goBack" data-pass-event class="px-4 py-2 bg-fill hover:bg-fill-hover border border-separator rounded-lg transition-colors flex items-center min-w-0 home-btn">
            <svg class="w-5 h-5 mr-1" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                <path d="M5.25 11h15a1.5 1.5 0 1 1 0 3H5.25a1.5 1.5 0 0 1 0-3z"/>
                <path d="M5.55 12 11.3 17.3a1.5 1.5 0 1 1-2.12 2.12L3 12l6.18-6.18a1.5 1.5 0 1 1 2.12 2.12L5.55 12z"/>
            </svg>
            <span class="home-btn-text">上一页</span>
        </a>
    </header>

    <!-- 密码验证弹窗 -->
    <div id="passwordModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[65] transition-opacity duration-300">
        <div class="bg-surface p-8 rounded-lg w-11/12 max-w-md border border-separator max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-6 flex-none">
                <h2 class="text-2xl font-bold gradient-text">访问验证</h2>
            </div>
            <div class="mb-6">
                <p class="text-ink-soft mb-4">请输入密码继续访问</p>
                <form id="passwordForm">
                    <input type="text" name="username" id="username" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
                    <input type="password" id="passwordInput" class="w-full bg-surface border border-separator text-white px-4 py-3 rounded-lg focus:outline-none focus:border-white transition-colors" placeholder="密码..." autocomplete="new-password">
                    <button id="passwordSubmitBtn" type="submit" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">提交</button>
                </form>
                <p id="passwordError" class="text-danger mt-2 hidden">密码错误，请重试</p>
            </div>
        </div>
    </div>

    <main class="container mx-auto px-4 py-4">
        <!-- 视频播放区 -->
        <div id="playerContainer" class="player-container mb-4">
            <div class="relative">
                <div id="player" class="player-placeholder" style="width: 100%; height: auto; aspect-ratio: 16/9; background-color: #1f2937; position: relative; display: block;">
                    <!-- Initial loading state before JavaScript loads -->
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white;">
                        <div style="width: 48px; height: 48px; border: 4px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top-color: #f97316; margin: 0 auto 16px; animation: spin 1s linear infinite;"></div>
                        <div style="font-size: 16px; font-weight: 500;" id="loading-title">正在加载视频...</div>
                    </div>
                </div>
                <div class="loading-container" id="player-loading" style="display: none;">
                    <div class="loading-spinner"></div>
                    <div>正在加载视频...</div>
                </div>
                <div class="error-container" id="error">
                    <div class="error-icon">⚠️</div>
                    <div id="error-message">视频加载失败</div>
                    <div style="margin-top: 10px; font-size: 14px; color: #aaa;">请尝试其他视频源或稍后重试</div>
                </div>
            </div>
        </div>

        <!-- 源信息 -->
        <div class="player-container flex justify-between py-2 px-4 mb-2 bg-fill" id="resourceInfoBarContainer">
            <!-- 资源信息卡片、切换按钮、视频数将由JS动态渲染 -->
        </div>

        <!-- 集数导航 -->
        <div class="player-container">
            <div class="flex justify-between items-center my-4">
                <button data-action="playPreviousEpisode" id="prevButton" class="px-4 py-2 bg-fill hover:bg-fill-hover border border-separator rounded-lg transition-colors">
                    <svg class="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    上一集
                </button>
                <span class="text-ink-2" id="episodeInfo">加载中...</span>
                <button data-action="playNextEpisode" id="nextButton" class="px-4 py-2 bg-fill hover:bg-fill-hover border border-separator rounded-lg transition-colors">
                    下一集
                    <svg class="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 添加自动播放开关和排序按钮 -->
        <div class="player-container mb-2">
            <div class="flex flex-wrap justify-end items-center gap-2">
                <!-- 自动连播开关 - 分组到左边 -->
                <div class="flex items-center gap-1 flex-shrink-0 mr-auto">
                    <span class="text-ink-2 text-sm whitespace-nowrap">自动连播</span>
                    <label class="switch">
                        <input type="checkbox" id="autoplayToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                
                <!-- 把各种功能按钮放在右侧 - 在小屏幕上各自占一行 -->
                <div class="flex flex-wrap justify-end gap-2">
                    <!-- 倒序排列按钮 -->
                    <button data-action="toggleEpisodeOrder" class="px-3 py-1 bg-fill hover:bg-fill-hover border border-separator rounded-lg transition-colors flex items-center space-x-1 flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" id="orderIcon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v3.586L7.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 10.586V7z" clip-rule="evenodd" />
                        </svg>
                        <span id="orderText">倒序排列</span>
                    </button>
                    
                    <!-- 复制链接按钮 -->
                    <button title="复制播放链接" data-action="copyLinks" class="px-2 py-1 bg-fill hover:bg-fill-hover border border-separator text-white rounded-lg transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                    </button>
                    
                    <!-- 锁定控制按钮 - 始终显示在最右侧 -->
                    <button id="lockToggle" data-action="toggleControlsLock" title="锁定控制" 
                            class="px-2 py-1 bg-fill hover:bg-fill-hover border border-separator text-white rounded-lg transition flex-shrink-0">
                        <svg id="lockIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <!-- 默认状态：未锁图标 -->
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 11V7a3 3 0 00-6 0v4m-3 4h12v6H6v-6z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 集数网格 -->
        <div class="player-container">
            <div class="episode-grid" id="episodesGrid">
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2" id="episodesList">
                    <!-- 集数将在这里动态加载 -->
                    <div class="col-span-full text-center text-ink-2 py-8">加载中...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- 添加快捷键提示元素 -->
    <div class="shortcut-hint" id="shortcutHint">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="shortcutIcon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span id="shortcutText"></span>
    </div>

    <!-- 页脚区域 -->
    <footer class="footer mt-2 py-6 border-t border-separator bg-surface">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <div class="flex items-center justify-center md:justify-start">
                        <img src="image/logo.png" alt="" class="w-6 h-6 mr-2 rounded-md">
                        <span class="font-semibold">PlayAny TV</span>
                    </div>
                    <p class="text-ink-3 text-sm mt-2 text-center md:text-left">© 2025 PlayAny TV · 想看就看，随处可播</p>
                </div>
                
                <div class="text-center md:text-right">
                    <p class="text-ink-3 text-sm max-w-md">
                        免责声明：本站仅为视频搜索工具，不存储、上传或分发任何视频内容。
                        所有视频均来自第三方API接口。如有侵权，请联系相关内容提供方。
                    </p>
                    <div class="mt-2 flex justify-center md:justify-end space-x-4">
                        <a href="about.html" class="text-ink-2 hover:text-ink text-sm transition-colors">关于我们</a>
                        <a href="privacy.html" class="text-ink-2 hover:text-ink text-sm transition-colors">隐私政策</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- 换源模态框 -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center transition-opacity duration-300 z-[10000]">
        <div class="bg-surface p-8 rounded-lg w-11/12 max-w-4xl border border-separator max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-6 flex-none">
                <h2 id="modalTitle" class="text-2xl font-bold gradient-text break-words pr-4 max-w-[80%]"></h2>
                <button data-action="closeModal" class="text-ink-2 hover:text-ink text-2xl transition-colors flex-shrink-0">&times;</button>
            </div>
            <div id="modalContent" class="overflow-auto flex-1 min-h-0">
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2">
                </div>
            </div>
        </div>
    </div>

    <!-- 添加 loading 提示框 -->
    <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[10001]">
        <div class="bg-surface p-8 rounded-lg border border-separator flex items-center space-x-4">
            <div class="w-8 h-8 border-4 border-separator border-t-transparent rounded-full animate-spin"></div>
            <p class="text-white text-lg">加载中...</p>
        </div>
    </div>

    <!-- 引入纯 JS sha256（HTTP 下依然可用） -->
    <script src="libs/sha256.min.js"></script>
    
    <script src="js/config.js"></script>
    <script src="js/actions.js"></script>
    <script src="lib/target-guard.mjs"></script>
    <script src="js/native-app.js"></script>
    <script src="js/tv-focus.js"></script>
    <script src="js/password.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/play-context.js"></script>
    <script src="js/search.js"></script>
    <script src="libs/hls.min.js" crossorigin="anonymous"></script>
    <script src="libs/artplayer.min.js" crossorigin="anonymous"></script>
    <script src="js/player-controls.js"></script>
    <script src="js/player-sources.js"></script>
    <script src="js/player-progress.js"></script>
    <script src="js/player.js"></script>
    <!-- 离线缓存（仅 App 生效） -->
    <script src="js/downloads.js"></script>
    <script src="js/downloads-ui.js"></script>
</body>
</html>
